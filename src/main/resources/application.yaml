quarkus:
  native:
    resources:
      includes: templates/**
  banner:
    path: wombat-banner.txt
  http:
    limits:
      max-initial-line-length: 32768
    auth:
      permission:
        public:
          enabled: ${quarkus.oidc.tenant-enabled}
          policy: permit
          paths:
            - /q/metrics
            - /q/health
            - /q/health/*
            - /logout
            - /public/*
            - /vendor/*
            - /icons/*
        authenticated:
          enabled: ${quarkus.oidc.tenant-enabled}
          policy: authenticated
          paths:
            - /*
  rest-client:
    logging:
      scope: none
      body-limit: 1024
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"

  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./data/db/local.db"
      min-size: 0
  ## PostgreSQL Datasource Configuration
  #datasource:
  #  db-kind: postgresql
  #  username: my-username
  #  password: my-password
  #  jdbc:
  #    url: "jdbc:postgresql://localhost:5432/wombat"

  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration/${quarkus.datasource.db-kind}
  scheduler:
    enabled: true
  kubernetes-client:
    devservices:
      enabled: false
  # `tenant-enabled` is the single switch for access control: false (the shipped default) contacts no
  # identity provider and, through the expressions in http.auth.permission below, leaves every request
  # anonymous. Set QUARKUS_OIDC_TENANT_ENABLED=true — with client-id and credentials.secret supplied per
  # deployment — to require a Google Workspace account. Both config roots are runtime, so the flag flips
  # authentication and authorization together; startup fails fast if the credentials are missing.
  oidc:
    tenant-enabled: false
    # Presets accounts.google.com, the openid/email/profile scopes and access-token verification through
    # the UserInfo endpoint (Google access tokens are opaque). Override for another OIDC provider.
    provider: google
    # `hybrid`: browsers go through the authorization code flow, API clients may pass a bearer token.
    application-type: hybrid
    client-id: xxx
    credentials:
      secret: xxx
    authentication:
      extra-params:
        # Google publishes no end_session_endpoint, so signing out can only clear the local session: without
        # this, the next visit is re-authenticated silently and the logout looks broken. `select_account`
        # makes Google show the account chooser instead. Drop it to trade that for one-click sign-in.
        prompt: select_account
    token:
      # This is what restricts access to the organisation. `hd` (hosted domain) is issued only for Google
      # Workspace accounts, so a consumer account using an @illuin.tech address carries none and is refused
      # at token validation. Only string claims can be matched here; several values may be listed.
      required-claims:
        hd: illuin.tech
  keycloak:
    devservices:
      # Never start a Keycloak container: OIDC is configured against the real provider or left disabled.
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

module:
  kubernetes-api:
    enabled: true
  llm-prometheus:
    enabled: true
  llm-static:
    enabled: true
  extension:
    path: "extensions"

monitor:
  heartbeat: "*/10 * * * * ?" # every 10s
  environments-file: "monitored/monitored-environments.yaml"

ui:
  max-date-range:
    duration: 1
    unit: YEARS

connector:
  boavizta:
    uri: "https://api.boavizta.org/v1/"
  ecologits:
    uri: "https://api.ecologits.ai/"

backup:
  enabled: false
  cron: "0 0 2 * * ?"
  restore-on-startup: true
  cleanup:
    enabled: true
    cron: "0 0 3 * * ?"
    retain-last: 10
